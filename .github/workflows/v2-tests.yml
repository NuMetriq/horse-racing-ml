name: V2 focused tests

on:
  push:
    branches:
      - v2-rebuild-master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-v2.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-v2.txt

      - name: Run focused tests
        run: >
          python -m unittest -v
          test_distance
          test_feature_transforms
          test_prior_form
          test_race_metrics
          test_calibration
          test_racecard_inference